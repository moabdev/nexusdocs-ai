services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: nexusdocs-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nexusdocs-app:latest
    container_name: nexusdocs-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=NexusDocs AI
      - APP_ENV=production
      - APP_DEBUG=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - EMBEDDING_VECTOR_SIZE=${EMBEDDING_VECTOR_SIZE:-384}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-nexusdocs}
      - KNOWLEDGE_BASE_DIR=/knowledge-base/velox-logistics
    volumes:
      - ./knowledge-base:/knowledge-base:ro
    depends_on:
      - qdrant

  web:
    image: nexusdocs-app:latest
    container_name: nexusdocs-web
    restart: unless-stopped
    ports:
      - "8501:8501"
      - "80:8501"
    environment:
      - NEXUSDOCS_API_URL=http://api:8000
    command: ["streamlit", "run", "src/nexusdocs/web/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    depends_on:
      - api

volumes:
  qdrant_data:
