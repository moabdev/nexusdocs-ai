[project]
name = "nexusdocs"
version = "0.1.0"
description = "Backend service for the NexusDocs AI enterprise knowledge intelligence platform."
readme = "README.md"
authors = [
    { name = "moabdev" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "google-genai>=2.19.0",
    "pypdf>=6.16.1",
    "qdrant-client>=1.19.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "uvicorn[standard]>=0.52.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
